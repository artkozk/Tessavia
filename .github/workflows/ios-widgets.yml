name: iOS widget checks

on:
  push:
    branches: [main]
    paths:
      - mobile/ios/**
      - .github/workflows/ios-widgets.yml
  pull_request:
    paths:
      - mobile/ios/**
      - .github/workflows/ios-widgets.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-widget-${{ github.ref }}
  cancel-in-progress: true

jobs:
  simulator:
    runs-on: macos-15
    timeout-minutes: 25
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
      HOMEBREW_NO_AUTO_UPDATE: '1'
    steps:
      - uses: actions/checkout@v5
      - name: Install the Xcode project generator
        run: brew install xcodegen
      - name: Build application and WidgetKit extension; run simulator tests
        shell: bash
        run: bash mobile/ios/ci-test.sh
      - name: Preserve simulator verification results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tessavie-ios-simulator-checks
          path: ${{ runner.temp }}/tessavie-ios
          if-no-files-found: warn
          retention-days: 7
