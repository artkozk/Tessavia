name: TessavieWidgets
options:
  minimumXcodeGenVersion: 2.42.0
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: YES
targets:
  TessavieWidgets:
    type: application
    platform: iOS
    sources:
      - App
      - Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ru.tessavie.widgets.ios
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Config/App-Info.plist
        CODE_SIGN_ENTITLEMENTS: Config/Widgets.entitlements
    dependencies:
      - target: TessavieWidgetExtension
        embed: true
  TessavieWidgetExtension:
    type: app-extension
    platform: iOS
    sources:
      - Widget
      - Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ru.tessavie.widgets.ios.WidgetExtension
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Config/Widget-Info.plist
        CODE_SIGN_ENTITLEMENTS: Config/Widgets.entitlements
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES
  TessavieWidgetTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - Tests
      - Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ru.tessavie.widgets.ios.tests
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGNING_ALLOWED: NO
schemes:
  TessavieWidgets:
    build:
      targets:
        TessavieWidgets: all
    run:
      config: Debug
  TessavieWidgetTests:
    build:
      targets:
        TessavieWidgetTests: [test]
    test:
      config: Debug
      gatherCoverageData: true
      targets:
        - TessavieWidgetTests
