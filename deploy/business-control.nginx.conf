server {
    # After TLS is provisioned, the HTTPS server includes the settings from
    # tessavie-performance.nginx.conf; see TESSAVIE_PERFORMANCE_2026_09_03.md.
    listen 80;
    listen [::]:80;
    server_name control.e-rd.ru;

    # Uploads allow 15 MiB per file plus multipart overhead; Go checks the file itself.
    client_max_body_size 16m;
    add_header X-Robots-Tag "noindex, nofollow, nosnippet" always;

    location / {
        proxy_pass http://127.0.0.1:8522;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
